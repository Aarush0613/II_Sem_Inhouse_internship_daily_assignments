<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration Confirmation System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
body{
background:#eef3ff;
font-family:Arial,Helvetica,sans-serif;
}
header{
background:#0d6efd;
color:#fff;
padding:15px;
text-align:center;
font-size:28px;
font-weight:bold;
}
footer{
background:#0d6efd;
color:#fff;
padding:10px;
text-align:center;
margin-top:30px;
}
.card{
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}
.confirm-card{
display:none;
background:linear-gradient(135deg,#0d6efd,#6610f2);
color:white;
}
.avatar{
width:90px;
height:90px;
border-radius:50%;
background:white;
color:#0d6efd;
display:flex;
align-items:center;
justify-content:center;
font-size:45px;
margin:auto;
}
</style>
</head>
<body>

<header>
<i class="fa-solid fa-user-graduate"></i>
 Student Registration Confirmation System
</header>

<div class="container my-4">

<div class="row">

<div class="col-lg-6">

<div class="card p-4">

<h3 class="mb-3">Registration Form</h3>

<form id="studentForm">

<div class="mb-3">
<label>Name</label>
<input type="text" id="name" class="form-control">
</div>

<div class="mb-3">
<label>Email</label>
<input type="email" id="email" class="form-control">
</div>

<div class="mb-3">
<label>CGPA</label>
<input type="number" step="0.1" id="cgpa" class="form-control">
</div>

<div class="mb-3">
<label>Branch</label>
<select id="branch" class="form-select">
<option value="">Select</option>
<option>CSE</option>
<option>IT</option>
<option>ECE</option>
<option>ME</option>
<option>CE</option>
</select>
</div>

<div class="mb-3">
<label>College</label>
<input type="text" id="college" class="form-control">
</div>

<button class="btn btn-primary w-100">Submit</button>

</form>

<div id="message" class="mt-3"></div>

</div>

</div>

<div class="col-lg-6">

<div class="card confirm-card p-4" id="confirmCard">

<div class="avatar">
<i class="fa-solid fa-user"></i>
</div>

<h3 class="text-center mt-3">Welcome</h3>

<hr>

<p><b>Name :</b> <span id="cName"></span></p>
<p><b>Email :</b> <span id="cEmail"></span></p>
<p><b>Branch :</b> <span id="cBranch"></span></p>
<p><b>College :</b> <span id="cCollege"></span></p>
<p><b>CGPA :</b> <span id="cCgpa"></span></p>
<p><b>Grade :</b> <span id="cGrade"></span></p>
<p><b>Date :</b> <span id="cDate"></span></p>

</div>

</div>

</div>

</div>

<footer>
Created using HTML + CSS + Bootstrap + JavaScript + jQuery + JSON
</footer>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script>

function calculateGrade(cgpa){

if(cgpa>=9)
return "A+";

if(cgpa>=8)
return "A";

if(cgpa>=7)
return "B";

if(cgpa>=6)
return "C";

return "D";

}

$("#studentForm").submit(function(e){

e.preventDefault();

let name=$("#name").val().trim();
let email=$("#email").val().trim();
let cgpa=$("#cgpa").val();
let branch=$("#branch").val();
let college=$("#college").val();

if(name==""||email==""||cgpa==""||branch==""||college==""){
$("#message").html('<div class="alert alert-danger">Please fill all fields.</div>');
return;
}

let student={
name:name,
email:email,
cgpa:cgpa,
branch:branch,
college:college,
grade:calculateGrade(Number(cgpa)),
date:new Date().toLocaleDateString()
};

let jsonData=JSON.stringify(student);
console.log(jsonData);

$("#message").html('<div class="alert alert-success">Data validated successfully. (POST simulated)</div>');

$("#cName").text(student.name);
$("#cEmail").text(student.email);
$("#cBranch").text(student.branch);
$("#cCollege").text(student.college);
$("#cCgpa").text(student.cgpa);
$("#cGrade").text(student.grade);
$("#cDate").text(student.date);

$("#confirmCard").fadeIn();

});

</script>

</body>
</html>
